name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Deploy environment'
        required: false
        type: choice
        options:
          - none
          - staging
          - production

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt

      - name: Run Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Run MyPy (type check)
        run: mypy app/ --ignore-missing-imports

  tests:
    name: Tests (Unit + Integration + Architecture + Charts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install -r requirements.txt

      - name: Run all tests
        run: python -m pytest tests/ -v --tb=short --timeout=60

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          flags: tests
          fail_ci_if_error: false

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
          pip install -r requirements.txt

      - name: Run Bandit (Python security linter)
        run: |
          bandit -r app/ -f json -o bandit-report.json --skip B101,B601 || true

      - name: Run Safety (dependency vulnerability scan)
        run: |
          safety check --json --output safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          retention-days: 30
          path: |
            bandit-report.json
            safety-report.json

  docker-build:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck, tests, security-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build monolith image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: queryx:monolith
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test monolith container
        run: |
          docker run -d --name queryx-test -p 8000:8000 queryx:monolith
          for i in {1..30}; do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "Health check passed"
              break
            fi
            echo "Waiting for service... ($i/30)"
            sleep 2
          done
          curl -f http://localhost:8000/api/health || (docker logs queryx-test && exit 1)
          docker stop queryx-test

      - name: Build microservices images
        run: |
          docker compose build

      - name: Test microservices startup
        run: |
          docker compose up -d
          for i in {1..40}; do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "Gateway health check passed"
              break
            fi
            echo "Waiting for gateway... ($i/40)"
            sleep 3
          done
          curl -f http://localhost:8000/api/health || (docker compose logs && exit 1)
          docker compose down

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build
    if: github.ref == 'refs/heads/develop' || github.event.inputs.deploy_env == 'staging'
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: kubectl apply -f k8s/staging/

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event.inputs.deploy_env == 'production'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Example: kubectl apply -f k8s/production/

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-and-typecheck, tests, security-scan, docker-build]
    if: always()
    steps:
      - name: Determine overall status
        id: status
        run: |
          STATUS="${{ needs.lint-and-typecheck.result }}"
          for job in tests security-scan docker-build; do
            RESULT="${{ needs.$job.result }}"
            if [ "$RESULT" != "success" ]; then
              STATUS="failure"
            fi
          done
          echo "overall_status=$STATUS" >> $GITHUB_OUTPUT
          echo "Overall status: $STATUS"

      - name: Post status to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.status.outputs.overall_status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const body = `${emoji} **CI Pipeline**: ${status.toUpperCase()}\n\n` +
              `- Lint & Type Check: ${{ needs.lint-and-typecheck.result }}\n` +
              `- Tests: ${{ needs.tests.result }}\n` +
              `- Security Scan: ${{ needs.security-scan.result }}\n` +
              `- Docker Build: ${{ needs.docker-build.result }}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });